name: Publish to ComfyUI Registry

on:
  push:
    paths:
      - pyproject.toml
    branches: [ main ]

jobs:
  publish:
    name: Publish Custom Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check whether the version changed
        id: version
        run: |
          # The path filter fires on any pyproject.toml edit, but the registry
          # rejects a re-publish of an existing version with a 400. Only run the
          # publish step when [project] version actually moved.
          read_version() { sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' | head -1; }
          current=$(read_version < pyproject.toml)
          previous=$(git show HEAD^:pyproject.toml 2>/dev/null | read_version || true)
          echo "previous=${previous:-<none>} current=$current"
          if [ "$current" = "$previous" ]; then
            echo "Version unchanged; skipping publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Registry
        if: steps.version.outputs.changed == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
